<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- favicon do PixelClima: sol em pixel art, verde-limão sobre o fundo escuro do site -->
  <rect width="16" height="16" fill="#0b120d"/>
  <g fill="#b6f36a">
    <!-- raios -->
    <rect x="7" y="1" width="2" height="2"/>
    <rect x="7" y="13" width="2" height="2"/>
    <rect x="1" y="7" width="2" height="2"/>
    <rect x="13" y="7" width="2" height="2"/>
    <rect x="3" y="3" width="2" height="2"/>
    <rect x="11" y="3" width="2" height="2"/>
    <rect x="3" y="11" width="2" height="2"/>
    <rect x="11" y="11" width="2" height="2"/>
    <!-- disco -->
    <rect x="6" y="5" width="4" height="6"/>
    <rect x="5" y="6" width="6" height="4"/>
  </g>
  <rect x="6" y="6" width="2" height="1" fill="#eef2df"/>
</svg>
